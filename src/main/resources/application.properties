# Spring Boot Application Configuration
# This file contains application-specific properties

# Application name
spring.application.name=demo

# Server configuration (default port is 8080)
# Uncomment to customize:
# server.port=8080

# Actuator endpoints configuration
# SECURITY: Only expose non-sensitive actuator endpoints for monitoring
# health and info are safe to expose; other endpoints may contain sensitive data
management.endpoints.web.exposure.include=health,info
